ext {
    extName = 'DeTodoPeliculas'
    extClass = '.DeTodoPeliculas'
    themePkg = 'dooplay'
    baseUrl = 'https://detodopeliculas.nu'
    overrideVersionCode = 20
}

apply from: "$rootDir/common.gradle"

dependencies {
    implementation(project(':lib:cloudflare-interceptor'))
    implementation(project(":lib:streamwish-extractor"))
    implementation(project(":lib:uqload-extractor"))
    implementation(project(':lib:okru-extractor'))
    implementation(project(':lib:vidhide-extractor'))
    implementation(project(':lib:vidguard-extractor'))
    implementation(project(':lib:voe-extractor'))
}
